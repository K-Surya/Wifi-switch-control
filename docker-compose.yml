services:
  wifi-switch-control:
    build: .
    container_name: wifi-switch-control
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_STORE_FILE: /data/sessions.json
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    volumes:
      - wifi-switch-sessions:/data

volumes:
  wifi-switch-sessions:
