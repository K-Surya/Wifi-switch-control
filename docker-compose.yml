services:
  wifi-switch-control:
    build: .
    container_name: wifi-switch-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_STORE_FILE: /data/sessions.json
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - wifi-switch-private
    volumes:
      - wifi-switch-sessions:/data

networks:
  wifi-switch-private:
    external: true

volumes:
  wifi-switch-sessions:
